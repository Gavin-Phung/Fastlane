name: Run tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        run: bundle exec fastlane test
